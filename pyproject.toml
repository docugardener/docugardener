[project]
name = "docugardener"
version = "0.1.0"
description = "AI-powered documentation drift detection service"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-or-later"}
authors = [
    {name = "DocuGardener Team"}
]
keywords = ["documentation", "drift-detection", "ai", "rag", "github"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    "PyGithub>=2.1.0",
    "gitpython>=3.1.40",
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "sentence-transformers>=2.2.0",
    # "pinecone>=3.0.0",  # Installed manually in Dockerfile due to conflict
    "weaviate-client>=4.4.0",
    "google-generativeai>=0.8.0",
    "openai>=1.0.0",
    "anthropic>=0.49.0",
    "redis>=5.0.0",
    "rq>=1.15.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.19.0",
    "stripe>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["docugardener"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "e2e: end-to-end tests that fire real GitHub PRs and require the full dev stack (make dev-up). Run with: E2E_ENABLED=1 pytest tests/e2e/ -m e2e -x -v -s",
]
