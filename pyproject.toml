[project]
name = "docugardener"
version = "0.1.0"
description = "AI-powered documentation drift detection service"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-or-later"}
authors = [
    {name = "DocuGardener Team"}
]
keywords = ["documentation", "drift-detection", "ai", "rag", "github"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    "PyGithub>=2.1.0",
    "gitpython>=3.1.40",
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "sentence-transformers>=2.2.0",
    # "pinecone>=3.0.0",  # Installed manually in Dockerfile due to conflict
    "weaviate-client>=4.4.0",
    "google-generativeai>=0.8.0",
    "openai>=1.0.0",
    "anthropic>=0.49.0",
    "redis>=5.0.0",
    "rq>=1.15.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.19.0",
    "stripe>=10.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "apscheduler>=3.10.0",
    "click>=8.1.0",
    "cryptography>=41.0.0",
    "PyJWT>=2.8.0",
    "numpy>=1.26.0",
    "pathspec>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff==0.14.10",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = [
  "E501",   # line too long — handled by formatter
  # Naming conventions: existing codebase uses camelCase/mixed conventions
  "N803",   # argument name should be lowercase
  "N805",   # first argument of method should be named 'self'
  "N806",   # variable in function should be lowercase
  "N814",   # camelCase imported as constant
  "N815",   # mixedCase variable in class scope
  "N818",   # exception name should end in 'Error'
  # Common patterns accepted in this codebase
  "B008",   # function call in default argument (SQLAlchemy / FastAPI Depends)
  "B904",   # raise without 'from err' (pre-existing; tracked separately)
  "B905",   # zip() without explicit strict= parameter
  "B017",   # assertRaises without context manager
  "C401",   # unnecessary generator (set comprehension)
  "C408",   # unnecessary dict call
  "E402",   # module level import not at top of file
  "E741",   # ambiguous variable name
  "F841",   # local variable assigned but never used
  "SIM102", # use single if with 'and' instead of nested ifs
  "SIM103", # return condition directly (pre-existing patterns)
  "SIM105", # use contextlib.suppress instead of try-except-pass
  "SIM108", # use ternary operator (pre-existing patterns)
  "SIM117", # use single with statement (pre-existing test patterns)
  "W291",   # trailing whitespace (in multi-line strings/prompts)
  "W293",   # whitespace in blank lines (in docstrings/test fixtures)
]

[tool.ruff.lint.isort]
known-first-party = ["docugardener"]

[tool.mypy]
python_version = "3.11"
# strict = true intentionally disabled — SQLAlchemy Column types, FastAPI
# dependency injection, and other framework patterns generate too many
# false positives under strict mode. Enforce the checks that add real value.
ignore_missing_imports = true
no_strict_optional = true
allow_untyped_defs = true
allow_incomplete_defs = true
warn_return_any = false
warn_unused_ignores = false
disable_error_code = [
  "type-arg",       # generic types without parameters (SQLAlchemy, dict, list)
  "valid-type",     # SQLAlchemy Base used as type
  "misc",           # misc SQLAlchemy class patterns
  "assignment",     # Column[T] vs T assignments throughout ORM models
  "no-any-return",  # SQLAlchemy / FastAPI return Any patterns
  "union-attr",     # Optional attribute access — handled by runtime guards
  "call-overload",  # dict.get overload false positives
  "arg-type",       # SQLAlchemy Column passed as primitive — false positives
  "unused-ignore",  # stale ignores accumulate between mypy versions
  "no-untyped-call",       # calls to untyped library functions (GitHub, Weaviate)
  "comparison-overlap",    # Column[bool] identity checks
  "var-annotated",         # inferred dict/list type vars without annotation
  "return-value",          # FastAPI JSONResponse vs dict return type
  "attr-defined",          # re-exported symbols not in __all__
  "import-untyped",        # third-party stubs missing (yaml, cuid, etc.)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "e2e: end-to-end tests that fire real GitHub PRs and require the full dev stack (make dev-up). Run with: E2E_ENABLED=1 pytest tests/e2e/ -m e2e -x -v -s",
]
