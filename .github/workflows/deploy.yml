# =============================================================================
# DocuGardener — Production CD Pipeline
# =============================================================================
# Triggers after CI passes on main.
# Flow: build & push images to GHCR → SSH deploy to Hetzner → smoke test.
#
# Required GitHub Actions secrets:
#   HETZNER_HOST       — VPS IP or hostname
#   HETZNER_SSH_KEY    — private key for the deploy user
#   CRON_SECRET        — 32-char hex for audit-retention cron
#
# Required GitHub Actions variables (vars.*):
#   APP_URL                     — https://docugardener.dev
#   NEXT_PUBLIC_BILLING_ENABLED — false  (flip to true when legal entity ready)
# =============================================================================

name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Never cancel an in-flight deploy — finish what we started.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ── Guard: only proceed if CI passed ─────────────────────────────────────────
  check-ci:
    name: Check CI result
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - run: echo "CI passed — proceeding with deploy"

  # ── Build & Push ─────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: check-ci
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set release tag
        id: tag
        run: echo "sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      # Python image — used by api, worker, scheduler
      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/docugardener/api:latest
            ghcr.io/docugardener/api:${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # Next.js image — used by web + migrate
      - name: Build & push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: |
            ghcr.io/docugardener/web:latest
            ghcr.io/docugardener/web:${{ steps.tag.outputs.sha }}
          build-args: |
            NEXT_PUBLIC_BILLING_ENABLED=${{ vars.NEXT_PUBLIC_BILLING_ENABLED }}
            NEXT_PUBLIC_APP_URL=${{ vars.APP_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ── Deploy ────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/docugardener

            # Pull latest code (compose files, Caddyfile, etc.)
            git fetch origin main
            git reset --hard origin/main

            export RELEASE_TAG="${{ needs.build-and-push.outputs.sha || 'latest' }}"

            # Pull new images
            docker compose -f docker/docker-compose.prod.yml pull \
              docugardener worker scheduler web migrate

            # Run DB migrations before swapping containers
            docker compose -f docker/docker-compose.prod.yml run --rm migrate

            # Rolling restart — stateless services only
            docker compose -f docker/docker-compose.prod.yml up -d --no-deps \
              docugardener worker scheduler web

            # Prune images older than 24h (keep last 2 deploys)
            docker image prune -af --filter "until=24h" || true

            echo "Deploy complete — $(date -u)"

  # ── Smoke Test ────────────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Wait for containers to stabilise
        run: sleep 15

      - name: Health check — FastAPI
        run: |
          for i in $(seq 1 12); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
              "${{ vars.APP_URL }}/health" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: status=$STATUS — retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 12 attempts"
          exit 1

      - name: API response validation
        run: |
          BODY=$(curl -sf "${{ vars.APP_URL }}/health")
          echo "$BODY"
          echo "$BODY" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d.get('status') == 'ok', f'Unexpected health response: {d}'
          print('API response valid')
          "
