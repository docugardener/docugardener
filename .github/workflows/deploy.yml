# =============================================================================
# DocuGardener — Production CD Pipeline
# =============================================================================
# Triggers after CI passes on main.
# Flow: SSH to Hetzner → git pull → docker compose up --build -d → smoke test.
# No container registry needed — images are built on the server.
#
# Required GitHub Actions secrets:
#   HETZNER_HOST     — VPS IP or hostname
#   HETZNER_SSH_KEY  — private key for the deploy user
#
# Required GitHub Actions variables (vars.*):
#   APP_URL                     — your public URL, e.g. https://docugardener.dev
#   NEXT_PUBLIC_BILLING_ENABLED — false  (flip to true when legal entity ready)
# =============================================================================

name: Deploy to Production

on:
  # Deploy manually: gh workflow run deploy.yml --repo docugardener/docugardener
  # CI no longer runs on push, so auto-deploy after CI is removed.
  # Run CI first if you want verification: gh workflow run ci.yml
  workflow_dispatch:

# Never cancel an in-flight deploy — finish what we started.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ── Gate: echo intent (all deploys are manual) ───────────────────────────────
  check-ci:
    name: Check CI result
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - run: echo "CI passed — proceeding with deploy"

      - name: Set deploy status — pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run?.head_sha ?? context.sha,
              state: 'pending',
              context: 'deploy / smoke-test',
              description: 'Deploying to production…',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })

  # ── Deploy ────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: check-ci
    environment: production

    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail

            echo "==> Pulling latest code..."
            git config --global --add safe.directory /opt/docugardener || true
            # Docker builds run as root and can leave root-owned files in the working tree.
            # chown the entire repo dir (not just .git/) so git reset can unlink any file.
            sudo /bin/chown -R deploy:deploy /opt/docugardener/ || true
            cd /opt/docugardener
            git fetch origin main
            git reset --hard origin/main

            echo "==> Building and starting services..."
            docker compose --env-file /opt/docugardener/.env -f /opt/docugardener/docker/docker-compose.prod.yml up --build -d

            echo "==> Pruning old images..."
            docker image prune -af --filter "until=24h" || true

            echo "==> Deploy complete — $(date -u)"

  # ── Smoke Test ────────────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      statuses: write
    env:
      # Self-hosters: set APP_URL as a GitHub Actions variable (Settings → Secrets and variables → Variables)
      # e.g. APP_URL=https://your-domain.example.com
      APP_URL: ${{ vars.APP_URL || 'https://docugardener.dev' }}

    steps:
      - name: Wait for containers to stabilise
        run: sleep 15

      - name: Health check — FastAPI
        run: |
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "${APP_URL}/health" 2>/dev/null)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: status=$STATUS — retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 12 attempts"
          exit 1

      - name: API response validation
        run: |
          BODY=$(curl -sf "${APP_URL}/health")
          echo "$BODY"
          echo "$BODY" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d.get('status') in ('ok', 'healthy'), f'Unexpected health response: {d}'
          print('API response valid')
          "

      - name: Report deploy status — success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run?.head_sha ?? context.sha,
              state: 'success',
              context: 'deploy / smoke-test',
              description: `Deployed to production ✓`,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })

      - name: Report deploy status — failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run?.head_sha ?? context.sha,
              state: 'failure',
              context: 'deploy / smoke-test',
              description: 'Smoke test failed — production may be degraded',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
