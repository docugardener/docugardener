# =============================================================================
# DocuGardener — Production CD Pipeline
# =============================================================================
# Triggers after CI passes on main.
# Flow: SSH to Hetzner → git pull → docker compose up --build -d → smoke test.
# No container registry needed — images are built on the server.
#
# Required GitHub Actions secrets:
#   HETZNER_HOST     — VPS IP or hostname
#   HETZNER_SSH_KEY  — private key for the deploy user
#
# Required GitHub Actions variables (vars.*):
#   APP_URL                     — https://docugardener.dev
#   NEXT_PUBLIC_BILLING_ENABLED — false  (flip to true when legal entity ready)
# =============================================================================

name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Never cancel an in-flight deploy — finish what we started.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ── Guard: only proceed if CI passed ─────────────────────────────────────────
  check-ci:
    name: Check CI result
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - run: echo "CI passed — proceeding with deploy"

  # ── Deploy ────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: check-ci
    environment: production

    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail

            echo "==> Pulling latest code..."
            git config --global --add safe.directory /opt/docugardener || true
            cd /opt/docugardener
            git fetch origin main
            git reset --hard origin/main

            echo "==> Building and starting services..."
            docker compose --env-file /opt/docugardener/.env -f /opt/docugardener/docker/docker-compose.prod.yml up --build -d

            echo "==> Pruning old images..."
            docker image prune -af --filter "until=24h" || true

            echo "==> Deploy complete — $(date -u)"

  # ── Smoke Test ────────────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Wait for containers to stabilise
        run: sleep 15

      - name: Health check — FastAPI
        run: |
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "${{ vars.APP_URL }}/health" 2>/dev/null)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: status=$STATUS — retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 12 attempts"
          exit 1

      - name: API response validation
        run: |
          BODY=$(curl -sf "${{ vars.APP_URL }}/health")
          echo "$BODY"
          echo "$BODY" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d.get('status') == 'ok', f'Unexpected health response: {d}'
          print('API response valid')
          "
