# =============================================================================
# DocuGardener Security Scan — Trivy Container Image Scanning (I-06)
# =============================================================================
# Scans the Docker image for CRITICAL and HIGH CVEs on every push to main
# and on every PR targeting main. Results are uploaded to GitHub Security tab.
# =============================================================================

name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday 06:00 UTC to catch newly-disclosed CVEs
    - cron: "0 6 * * 1"

jobs:
  trivy:
    name: Trivy Image Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write  # Required to upload SARIF to GitHub Security tab

    steps:
      - name: Free up runner disk space
        run: |
          # GitHub-hosted runners ship with ~14 GB free; large Docker builds + Trivy DB exhaust it.
          # Remove pre-installed tooling that is not needed for image scanning.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          docker system prune -af --volumes || true
          df -h

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: docugardener:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "docugardener:scan"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true   # Only fail on fixable CVEs; unfixed = vendor's problem

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()  # Upload even if scan failed so results are visible
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy-container"
