# =============================================================================
# DocuGardener Security Scan — Trivy Container Image Scanning (I-06)
# =============================================================================
# Scans the Docker image for CRITICAL and HIGH CVEs.
# Runs weekly (Monday 06:00 UTC) to catch newly-disclosed CVEs.
# Results are uploaded to GitHub Security tab.
#
# NOTE: Intentionally NOT triggered on push/PR — the full image build takes
# 30+ min and exhausts GHA runner disk on every push. Weekly schedule is
# sufficient for CVE visibility; this is an informational scan only.
# =============================================================================

name: Security Scan

on:
  schedule:
    # Run weekly on Monday 06:00 UTC to catch newly-disclosed CVEs
    - cron: "0 6 * * 1"
  workflow_dispatch:  # Allow manual trigger when needed

jobs:
  trivy:
    name: Trivy Image Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write  # Required to upload SARIF to GitHub Security tab

    steps:
      - name: Free up runner disk space
        run: |
          # GitHub-hosted runners ship with ~14 GB free; large Docker builds + Trivy DB exhaust it.
          # Remove pre-installed tooling that is not needed for image scanning.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          docker system prune -af --volumes || true
          df -h

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: docugardener:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "docugardener:scan"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"         # Fail on CRITICAL/HIGH — report visible in GitHub Security tab
          ignore-unfixed: true   # Skip CVEs with no upstream fix available

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy-container"
