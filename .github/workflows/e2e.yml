name: E2E Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Playwright E2E (Chromium)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: docugardener-web
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5433/docugardener-web
      NEXTAUTH_SECRET: e2e-test-secret
      NEXTAUTH_URL: http://localhost:3001
      NODE_ENV: development   # enables dev-login CredentialsProvider

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run Prisma migrations
        working-directory: web
        run: npx prisma migrate deploy

      - name: Apply E2E seed
        working-directory: web
        run: |
          PGPASSWORD=password psql \
            -h localhost -p 5433 -U postgres -d docugardener-web \
            -f e2e/seed.sql

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Build Next.js
        working-directory: web
        run: npm run build

      - name: Start Next.js (background)
        working-directory: web
        run: npm start &

      - name: Wait for Next.js health
        run: |
          timeout 60 bash -c \
            'until curl -sf http://localhost:3001/api/health; do sleep 2; done'

      - name: Run E2E tests
        working-directory: web
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
