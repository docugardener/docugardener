# =============================================================================
# DocuGardener CI/CD Pipeline
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.13"

jobs:
  # ---------------------------------------------------------------------------
  # Lint & Type Check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # ruff is pinned in pyproject.toml [dev] — do NOT install ruff separately
          # or pip may override with a different version and break format checks.

      - name: Run Ruff linter
        run: ruff check src/ tests/
      
      - name: Run Ruff formatter check
        run: ruff format --check src/ tests/
      
      - name: Run MyPy type checker
        run: mypy src/ --ignore-missing-imports

  # ---------------------------------------------------------------------------
  # Unit Tests
  # ---------------------------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ -v --cov=src --cov-report=xml --cov-report=html --cov-fail-under=70

      - name: SCA — Python dependency audit (CI-04)
        run: |
          pip install pip-audit
          pip-audit --require-hashes=false --severity HIGH

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Integration Tests
  # ---------------------------------------------------------------------------
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    
    services:
      redis:
        image: valkey/valkey:7-alpine  # Valkey = MIT-licensed Redis 7 fork
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run integration tests
        env:
          REDIS_URL: redis://localhost:6379/0
          DEBUG: true
        run: |
          pytest tests/integration/ -v

  # ---------------------------------------------------------------------------
  # Frontend CI (lint + type-check + unit tests)
  # ---------------------------------------------------------------------------
  web-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint (zero errors)
        run: npx eslint . --ext .ts,.tsx --max-warnings=0 2>&1 | grep -v "^$" || true
        # The command above just prints warnings; the step below enforces zero errors
      - name: ESLint strict error gate
        run: |
          ERROR_COUNT=$(npx eslint . --ext .ts,.tsx --format=json 2>/dev/null | \
            python3 -c "import json,sys; data=json.load(sys.stdin); print(sum(m['severity']==2 for f in data for m in f['messages']))")
          echo "ESLint errors: $ERROR_COUNT"
          test "$ERROR_COUNT" -eq 0

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Vitest unit tests with coverage
        run: npx vitest run --coverage

      - name: Enforce coverage floor (≥70%)
        run: |
          LINES=$(cat coverage/coverage-summary.json | \
            python3 -c "import json,sys; d=json.load(sys.stdin); print(d['total']['lines']['pct'])")
          echo "Line coverage: $LINES%"
          python3 -c "import sys; pct=float('$LINES'); sys.exit(0 if pct >= 70 else 1)"

      - name: SCA — Node.js dependency audit (CI-04)
        run: npm audit --audit-level=high

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          directory: web/coverage
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Docker Build
  # ---------------------------------------------------------------------------
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          # GitHub-hosted runners start with ~14 GB free; large multi-stage
          # Docker builds exhaust it. Remove pre-installed toolchains we don't need.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          docker system prune -af --volumes || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          tags: docugardener:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
