# =============================================================================
# DocuGardener CI/CD Pipeline
# =============================================================================

name: CI

on:
  # Trigger manually: gh workflow run ci.yml --repo docugardener/docugardener
  # Do NOT add push/PR triggers — each CI run consumes ~28 GHA minutes (5 parallel jobs).
  # CI is run on-demand before releases, not on every push.
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"

jobs:
  # ---------------------------------------------------------------------------
  # Lint & Type Check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # ruff is pinned in pyproject.toml [dev] — do NOT install ruff separately
          # or pip may override with a different version and break format checks.

      - name: Run Ruff linter
        run: ruff check src/ tests/
      
      - name: Run Ruff formatter check
        run: ruff format --check src/ tests/
      
      - name: Run MyPy type checker
        run: mypy src/ --ignore-missing-imports

  # ---------------------------------------------------------------------------
  # Unit Tests
  # ---------------------------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ -v --cov=src --cov-report=xml --cov-report=html --cov-fail-under=70

      - name: SCA — Python dependency audit (CI-04)
        run: |
          pip install pip-audit
          pip-audit --skip-editable || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Integration Tests
  # ---------------------------------------------------------------------------
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint          # parallel with unit tests — both only require lint to pass

    services:
      redis:
        image: valkey/valkey:7-alpine  # Valkey = MIT-licensed Redis 7 fork
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run integration tests
        env:
          REDIS_URL: redis://localhost:6379/0
          DEBUG: true
        run: |
          pytest tests/integration/ -v

  # ---------------------------------------------------------------------------
  # Frontend CI (lint + type-check + unit tests)
  # ---------------------------------------------------------------------------
  web-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint (zero errors)
        run: npx eslint . --ext .ts,.tsx --max-warnings=0 2>&1 | grep -v "^$" || true
        # The command above just prints warnings; the step below enforces zero errors
      - name: ESLint strict error gate
        run: |
          ERROR_COUNT=$(npx eslint . --ext .ts,.tsx --format=json 2>/dev/null | \
            python3 -c "import json,sys; data=json.load(sys.stdin); print(sum(m['severity']==2 for f in data for m in f['messages']))")
          echo "ESLint errors: $ERROR_COUNT"
          test "$ERROR_COUNT" -eq 0

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Vitest unit tests with coverage
        run: npx vitest run --coverage

      - name: Enforce coverage floor (≥70%)
        run: |
          LINES=$(cat coverage/coverage-summary.json | \
            python3 -c "import json,sys; d=json.load(sys.stdin); print(d['total']['lines']['pct'])")
          echo "Line coverage: $LINES%"
          python3 -c "import sys; pct=float('$LINES'); sys.exit(0 if pct >= 70 else 1)"

      - name: SCA — Node.js dependency audit (CI-04)
        run: npm audit --audit-level=high

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          directory: web/coverage
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Secrets Scan (SEC-M2)
  # ---------------------------------------------------------------------------
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks can scan all commits on the branch

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Run gitleaks
        run: gitleaks detect --source . --log-opts="HEAD~50..HEAD" --redact --no-git=false --config .gitleaks.toml

  # Docker Build removed from per-push CI — image is built on the VPS during deploy
  # (docker compose up --build). This avoids the 30-40min cold-build penalty on
  # every push. Dockerfile correctness is validated by the deploy smoke test.
