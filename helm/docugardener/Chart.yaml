apiVersion: v2
name: docugardener
description: >
  Documentation drift detection for regulated industries.
  Self-hosted Helm chart for on-premise deployments (FinTech, MedTech, Government).
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - documentation
  - drift-detection
  - github
  - compliance
  - fintech
home: https://docugardener.ai
sources:
  - https://github.com/docugardener/docugardener
maintainers:
  - name: DocuGardener Team
    email: infra@docugardener.ai
annotations:
  artifacthub.io/license: AGPL-3.0-or-later
  artifacthub.io/signKey: |
    fingerprint: PLACEHOLDER_COSIGN_KEY
    url: https://docugardener.ai/cosign.pub

# Bitnami subcharts — disabled by default; use external for production
dependencies:
  - name: postgresql
    version: "12.x.x"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: postgresql.enabled
  - name: redis
    version: "17.x.x"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: redis.enabled
