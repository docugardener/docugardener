apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "docugardener.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "docugardener.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "docugardener.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "docugardener.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        # Force pod restart on configmap/secret change
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "docugardener.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "docugardener.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "docugardener.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: {{ include "docugardener.image" (dict "image" .Values.api.image "global" .Values.global "defaultTag" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          securityContext:
            {{- include "docugardener.containerSecurityContext" . | nindent 12 }}
          env:
            {{- include "docugardener.configEnvVars" . | nindent 12 }}
            {{- include "docugardener.secretEnvVars" . | nindent 12 }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if eq .Values.deploymentMode "air-gap" }}
            - name: LICENSE_FILE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.airGap.licenseSecretName | quote }}
                  key: license.json
                  optional: false
            {{- end }}
          volumeMounts:
            {{- include "docugardener.tmpVolumeMounts" . | nindent 12 }}
            {{- if eq .Values.deploymentMode "air-gap" }}
            - name: license-file
              mountPath: /etc/docugardener
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        {{- include "docugardener.tmpVolumes" . | nindent 8 }}
        {{- if eq .Values.deploymentMode "air-gap" }}
        - name: license-file
          secret:
            secretName: {{ .Values.airGap.licenseSecretName | quote }}
            items:
              - key: license.json
                path: license.json
        {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
