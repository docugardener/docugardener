{{- if .Values.api.podDisruptionBudget.enabled -}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "docugardener.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "docugardener.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "docugardener.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
{{- end }}
