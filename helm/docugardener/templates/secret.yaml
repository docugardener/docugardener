{{- if and .Values.secrets.create.enabled (not .Values.secrets.existingSecret) -}}
# Chart-managed secret — DEV/TEST ONLY.
# For production use secrets.existingSecret to reference an externally managed Secret
# (sealed-secrets, Vault agent injection, external-secrets operator, etc.)
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "docugardener.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "docugardener.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    docugardener.ai/secret-managed-by: "chart — replace with existingSecret in production"
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.create.databaseUrl | required "secrets.create.databaseUrl is required when secrets.create.enabled=true" | quote }}
  REDIS_URL: {{ .Values.secrets.create.redisUrl | required "secrets.create.redisUrl is required when secrets.create.enabled=true" | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.create.geminiApiKey | default "" | quote }}
  GITHUB_APP_ID: {{ .Values.secrets.create.githubAppId | required "secrets.create.githubAppId is required when secrets.create.enabled=true" | quote }}
  GITHUB_PRIVATE_KEY: {{ .Values.secrets.create.githubPrivateKey | required "secrets.create.githubPrivateKey is required when secrets.create.enabled=true" | quote }}
  ENCRYPTION_KEY: {{ .Values.secrets.create.encryptionKey | required "secrets.create.encryptionKey is required when secrets.create.enabled=true" | quote }}
  NEXTAUTH_SECRET: {{ .Values.secrets.create.nextauthSecret | required "secrets.create.nextauthSecret is required when secrets.create.enabled=true" | quote }}
  NEXTAUTH_URL: {{ .Values.secrets.create.nextauthUrl | required "secrets.create.nextauthUrl is required when secrets.create.enabled=true" | quote }}
  # HYB-14: License key (client-installed mode)
  {{- if .Values.license.key }}
  LICENSE_KEY: {{ .Values.license.key | b64enc | quote }}
  {{- end }}
{{- end }}
